name: Vite CI/CD - Dev & Prod with PR Preview Comments

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel
        id: vercel_deploy
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            vercel --token ${{ secrets.MENTOX_FRONTEND }} --prod --yes > deployment_url.txt
          else
            vercel --token ${{ secrets.MENTOX_FRONTEND }} --yes > deployment_url.txt
          fi
          echo "VERCEL_DEPLOYMENT_URL=$(cat deployment_url.txt)" >> $GITHUB_ENV

      - name: Post Preview Comment to PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ **Preview Deployment Successful**
            🔗 [Click to view preview](${{ env.VERCEL_DEPLOYMENT_URL }})
