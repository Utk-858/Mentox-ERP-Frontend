name: Vite CI/CD - Dev & Prod Deployments

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            DEPLOYMENT_URL=$(npx vercel --token=${{ secrets.MENTOX_FRONTEND }} --prod --yes)
          else
            DEPLOYMENT_URL=$(npx vercel --token=${{ secrets.MENTOX_FRONTEND }} --yes)
          fi
          echo "VERCEL_DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV

      - name: Show Vercel Deployment URL
        run: |
          echo "✅ Vercel Deployment URL: $VERCEL_DEPLOYMENT_URL"
